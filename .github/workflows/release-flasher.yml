name: Build and release firmware

# Push a tag like v1.2.0 to: build firmware for the release-ready
# environments (cyd, cyd-ili9341, awok, plus the cyd-fast/
# cyd-ili9341-fast 80MHz display-overclock variants the flasher's
# "experimental overclock" checkbox targets -- cyd35 stays excluded, see
# the build step below; cyd/cyd-ili9341 are the same physical 2.8"
# board, just the two display drivers it might have shipped with; the
# -fast pair is that same board again at a different display clock, not
# more boards), create a
# GitHub Release for that tag with each one's three raw PlatformIO
# artifacts attached (bootloader/partitions/firmware — the human-facing
# source of truth), then also merge each into one flashable image and
# attach those plus per-board version-stamped manifests. The repo is
# public now, so the web flasher itself is deployed straight to this
# repo's own GitHub Pages site (github.io/SquachWatch-CYD) as part of
# this same run — all three merged binaries and manifests are copied
# alongside index.html there so the browser fetches them same-origin
# (GitHub release assets don't send CORS headers, so the flasher page
# can't fetch them directly from the Releases tab). index.html's board
# picker swaps which manifest the install button targets.
on:
  push:
    tags:
      # v*.*.* is a real release: notes required, GitHub Release created.
      - "v*.*.*"
      # lab-* is a development build. Same firmware pipeline and the same
      # Pages deploy, but no release notes and no public Release -- it exists
      # so an unfinished feature can be flashed from a machine that is not
      # the one it was built on. See the `is_lab` output below.
      #
      # NOTE: this trigger needs a "lab-*" tag policy on the github-pages
      # environment, which by default allows only `master` and `v*`. Without
      # it the run is rejected before it starts. The dispatch input below runs
      # from master and needs no such change, so it is the working path today.
      - "lab-*"
  workflow_dispatch:
    inputs:
      lab:
        description: "Lab build: publish the unlisted mesh firmware, skip notes and Release"
        type: boolean
        default: false

permissions:
  contents: write   # create the GitHub Release
  pages: write       # deploy the flasher site
  id-token: write    # required by actions/deploy-pages

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.lab }}" = "true" ]; then
            # A manual lab run has no tag -- REF_NAME is the branch. Stamping
            # the manifests "master" would put that in the flasher's version
            # line, so lab builds are stamped with the commit they came from,
            # which is the only thing that identifies one.
            echo "version=lab-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi
          # Everything downstream keys off this rather than re-testing the
          # tag shape, so there is one definition of what a lab build is.
          # Either a lab-* tag, or a manual run with the lab box ticked. The
          # dispatch path exists because the github-pages environment only
          # permits deploys from master and v* -- a lab-* tag is rejected
          # before the job starts unless that policy is widened.
          if [ "${{ inputs.lab }}" = "true" ]; then
            echo "is_lab=true" >> "$GITHUB_OUTPUT"
          else
            case "$TAG" in
              lab-*) echo "is_lab=true"  >> "$GITHUB_OUTPUT" ;;
              *)     echo "is_lab=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Require release notes
        # Skipped for lab builds, which are not releases and have no notes to
        # write. The gate itself is NOT relaxed for real tags: it exists
        # because v1.5.5 and v1.5.6 both shipped with an auto-generated body
        # containing nothing but a changelog link.
        if: steps.ver.outputs.is_lab != 'true'
        # Fails in seconds, before the ~4 minute firmware build, because a
        # release with no notes is not a finished release and finding that
        # out afterwards means the tag is already public.
        #
        # This used to fall back to --generate-notes when the file was
        # missing. That fallback summarises merged pull requests, and this
        # repo commits straight to master -- so it had nothing to work with
        # and produced a body containing only a changelog link. v1.5.5 and
        # v1.5.6 both shipped that way before anyone noticed.
        run: |
          NOTES_FILE=".github/release-notes/${{ steps.ver.outputs.tag }}.md"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::No release notes for ${{ steps.ver.outputs.tag }}."
            echo ""
            echo "Create $NOTES_FILE, commit it, then re-run this workflow"
            echo "(or delete and re-push the tag)."
            echo ""
            echo "Recent notes to copy the house style from:"
            ls .github/release-notes/ | tail -5
            exit 1
          fi
          echo "Using $NOTES_FILE ($(wc -l < "$NOTES_FILE") lines)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        # cyd35 (3.5" board port) is also an environment in
        # platformio.ini now but isn't public-release-ready yet (it boot
        # loops on real hardware -- see platformio.ini) -- the rest are
        # and get built/published together below.
        run: |
          pio run -e cyd -e cyd-ili9341 -e awok -e cyd-fast -e cyd-ili9341-fast
          # The lab variant is built on every tag, not just lab-* ones, so a
          # real release proves it still compiles. It is only PUBLISHED on a
          # lab tag -- see the Pages step.
          pio run -e cyd-fast-mesh

      - name: Merge into one flashable image (per board)
        run: |
          pip install esptool
          python -m esptool --chip esp32 merge_bin \
            -o firmware-cyd-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  .pio/build/cyd/bootloader.bin \
            0x8000  .pio/build/cyd/partitions.bin \
            0x10000 .pio/build/cyd/firmware.bin
          python -m esptool --chip esp32 merge_bin \
            -o firmware-cyd-ili9341-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  .pio/build/cyd-ili9341/bootloader.bin \
            0x8000  .pio/build/cyd-ili9341/partitions.bin \
            0x10000 .pio/build/cyd-ili9341/firmware.bin
          python -m esptool --chip esp32 merge_bin \
            -o firmware-awok-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  .pio/build/awok/bootloader.bin \
            0x8000  .pio/build/awok/partitions.bin \
            0x10000 .pio/build/awok/firmware.bin
          # Every board's raw PlatformIO artifacts share the same basenames
          # (bootloader.bin/partitions.bin/firmware.bin), and release assets
          # need unique names -- the very first two-board release failed
          # partway through uploading when the second partitions.bin
          # collided with the first. The firmware is board-prefixed below.
          #
          # The bootloader and the partition table are NOT. All five builds
          # produce them byte for byte identical: they depend on the chip,
          # the partition CSV and the flash mode/size, and every environment
          # shares all of those. Only the display driver header and the pin
          # map differ, and both live entirely in the app. Five copies of
          # two identical files was eight redundant assets on the release
          # and eight more on the Pages site, every one of them fetched
          # over the wire by somebody.
          #
          # That identity is a property of today's configuration, not a
          # guarantee, so it is checked rather than assumed. Add a board
          # with a different flash size or partition table and this fails
          # loudly right here, which is far better than shipping it: a
          # mismatched bootloader does not report an error, it produces a
          # board that looks bricked.
          for f in bootloader partitions; do
            ref="$(sha256sum ".pio/build/cyd/$f.bin" | cut -d' ' -f1)"
            for v in cyd cyd-ili9341 awok cyd-fast cyd-ili9341-fast cyd-fast-mesh; do
              got="$(sha256sum ".pio/build/$v/$f.bin" | cut -d' ' -f1)"
              if [ "$got" != "$ref" ]; then
                echo "::error::$v/$f.bin differs from cyd/$f.bin."
                echo "These ship as one shared esp32-$f.bin, which is only"
                echo "valid while every environment produces the same file."
                echo "Give that board its own copy, or work out why it"
                echo "diverged, before releasing this."
                exit 1
              fi
            done
            cp ".pio/build/cyd/$f.bin" "esp32-$f.bin"
            echo "esp32-$f.bin is identical across all six builds ($ref)"
          done
          # The app, which is the only part that actually differs. cyd-fast
          # and cyd-ili9341-fast are the 80MHz display-overclock variants
          # the flasher's "experimental overclock" checkbox targets,
          # identical to their base build apart from -DSPI_FREQUENCY. No
          # merged image for those on purpose: the merged blob is a
          # manual-recovery artifact, and recovery should land you on the
          # spec-compliant build rather than the overclocked one.
          for v in cyd cyd-ili9341 awok cyd-fast cyd-ili9341-fast cyd-fast-mesh; do
            cp ".pio/build/$v/firmware.bin" "$v-firmware.bin"
          done

      - name: Stamp manifest versions
        run: |
          python - <<'PY'
          import json
          for p in ("web-flasher/manifest-cyd.json", "web-flasher/manifest-cyd-ili9341.json",
                    "web-flasher/manifest-awok.json", "web-flasher/manifest-cyd-fast.json",
                    "web-flasher/manifest-cyd-ili9341-fast.json",
                    "web-flasher/manifest-cyd-fast-mesh.json"):
              m = json.load(open(p))
              m["version"] = "${{ steps.ver.outputs.version }}"
              json.dump(m, open(p, "w"), indent=2)
          PY
          # These are attached to the release as well, and they are not
          # redundant with the Pages copies even though the flasher only
          # ever loads the Pages ones. "Keep the previous two releases
          # flashable" downloads each OLD release's manifest and drops it
          # into that release's own directory, where its relative paths
          # resolve against that release's binaries with no rewriting.
          # Stop attaching them and every release silently falls out of the
          # version picker one tag after it ships.
          cp web-flasher/manifest-cyd.json manifest-cyd.json
          cp web-flasher/manifest-cyd-ili9341.json manifest-cyd-ili9341.json
          cp web-flasher/manifest-awok.json manifest-awok.json
          cp web-flasher/manifest-cyd-fast.json manifest-cyd-fast.json
          cp web-flasher/manifest-cyd-ili9341-fast.json manifest-cyd-ili9341-fast.json

      - name: Create GitHub Release with build artifacts
        # A lab tag publishes a flashable build and nothing else. Creating a
        # Release for one would put an unfinished feature in the download list
        # next to the real firmware, which is the opposite of unlisted.
        if: steps.ver.outputs.is_lab != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Existence was already checked before the build, so there is
          # no fallback here -- the fallback is what let two releases
          # ship with an empty body.
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "SquachWatch-CYD ${{ steps.ver.outputs.tag }}" \
            --notes-file ".github/release-notes/${{ steps.ver.outputs.tag }}.md" \
            esp32-bootloader.bin \
            esp32-partitions.bin \
            cyd-firmware.bin \
            cyd-ili9341-firmware.bin \
            awok-firmware.bin \
            cyd-fast-firmware.bin \
            cyd-ili9341-fast-firmware.bin \
            firmware-cyd-merged.bin \
            firmware-cyd-ili9341-merged.bin \
            firmware-awok-merged.bin             manifest-cyd.json             manifest-cyd-ili9341.json             manifest-awok.json             manifest-cyd-fast.json             manifest-cyd-ili9341-fast.json

      - name: Build the browser emulator
        # Skipped on a lab run, which serves the released emulator instead --
        # see the Pages step for why. Only a tag needs a fresh one.
        if: steps.ver.outputs.is_lab != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Matched to the toolchain the working emulator was built with
          # locally. Pinned rather than "latest": a compiler bump that changes
          # the output is a thing to do deliberately and check, not something
          # to discover because the public page stopped loading.
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - name: Compile the emulator to WebAssembly
        if: steps.ver.outputs.is_lab != 'true'
        run: |
          set -euo pipefail
          em++ --version | head -1
          make -C sim wasm
          ls -l sim/web/squachsim.js sim/web/squachsim.wasm
          # An empty or tiny output means the link quietly failed; the site
          # would then serve a page that loads nothing and sits there blank.
          test -s sim/web/squachsim.wasm
          test "$(stat -c%s sim/web/squachsim.wasm)" -gt 200000

      - name: Assemble Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        # The flasher ships each board's three raw regions rather than
        # the single merged image, and the manifests place them at their
        # real offsets (0x1000/0x8000/0x10000). That matters: `esptool
        # merge_bin` pads the gaps between those regions with 0xFF, and
        # the gap between the partition table and the app is exactly
        # where NVS lives (0x9000, 20K). Flashing the merged blob at
        # offset 0 therefore wrote 20KB of 0xFF straight over saved
        # settings -- confirmed against the shipped v1.4.1 image, where
        # all 20480 bytes of that range are 0xFF -- so every web-flasher
        # update silently factory-reset the device. Writing the three
        # regions separately never touches 0x9000, which is what
        # `pio run -t upload` has always done.
        #
        # The merged images are still built and attached to the release
        # for manual `esptool write_flash 0x0` use; they just aren't what
        # the flasher page serves. Note they still wipe NVS by the same
        # mechanism, which for a deliberate full-image write is the
        # expected "start clean" behaviour.
        run: |
          mkdir -p _site
          cp web-flasher/index.html _site/index.html
          cp web-flasher/manifest-cyd.json _site/manifest-cyd.json
          cp web-flasher/manifest-cyd-ili9341.json _site/manifest-cyd-ili9341.json
          cp web-flasher/manifest-awok.json _site/manifest-awok.json
          cp web-flasher/manifest-cyd-fast.json _site/manifest-cyd-fast.json
          cp web-flasher/manifest-cyd-ili9341-fast.json _site/manifest-cyd-ili9341-fast.json
          # A LAB RUN MUST NOT CHANGE WHAT THE PUBLIC PAGE SERVES.
          #
          # A Pages deploy is wholesale -- there is no partial update -- so a
          # lab run republishes the entire site whether it means to or not.
          # The first one shipped this build's normal-board binaries, which
          # are master HEAD rather than the release, and stamped every
          # manifest lab-<sha>. Somebody arriving for the released firmware
          # got an unreleased build labelled with a commit.
          #
          # So the root site is restored from the latest release first, and
          # only then does the lab build get added alongside it. The lab
          # firmware is the sole thing this run contributes.
          if [ "${{ steps.ver.outputs.is_lab }}" = "true" ]; then
            LATEST="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
            if [ -z "$LATEST" ]; then
              echo "::error::No release to restore the root site from."
              exit 1
            fi
            echo "Restoring root site from $LATEST"
            gh release download "$LATEST" -D _site --clobber \
              -p '*-firmware.bin' -p 'manifest-*.json' -p 'esp32-*.bin'
            cp web-flasher/manifest-cyd-fast-mesh.json _site/manifest-cyd-fast-mesh.json
            cp cyd-fast-mesh-firmware.bin _site/cyd-fast-mesh-firmware.bin
            echo "lab build published alongside $LATEST: cyd-fast-mesh"
          fi
          # One shared bootloader and partition table (see the build step
          # for why that is safe and how it is enforced), then one app per
          # variant. Every manifest points at the same two shared files.
          cp esp32-bootloader.bin _site/esp32-bootloader.bin
          cp esp32-partitions.bin _site/esp32-partitions.bin
          for board in cyd cyd-ili9341 awok cyd-fast cyd-ili9341-fast; do
            cp "$board-firmware.bin" "_site/$board-firmware.bin"
          done
          # The browser emulator: this firmware compiled to WebAssembly,
          # so the site can offer "try it" next to "flash it".
          #
          # It is BUILT HERE on a tag, from the tag's own sources -- see the
          # "Build the browser emulator" step above. It used to be a committed
          # artifact that only refreshed when somebody remembered to run
          # `make wasm` before tagging, and that safeguard failed twice: once
          # at v1.5.8 (owned up to in the v1.5.9 notes) and again at v1.7.0,
          # which shipped v1.6.0's emulator. A check that depends on a person
          # remembering is not a check.
          #
          # The committed copy in web-flasher/emulator/ stays: it is what a lab
          # run serves and what somebody can open locally without emsdk. It is
          # just no longer what the public page gets on a release.
          #
          # The README's demo.gif has no such excuse any more. Its
          # renderer needs nothing but g++ and the sources already here --
          # see sim/make_demo.py.
          mkdir -p _site/emulator
          # A lab run serves the RELEASED emulator, for the same reason it
          # serves the released firmware: master's is built from unreleased
          # features, and the emulator is the public page's "try it". The
          # files are committed rather than release assets, so they come out
          # of the release tag's tree.
          if [ "${{ steps.ver.outputs.is_lab }}" = "true" ]; then
            git fetch --depth=1 origin "refs/tags/$LATEST:refs/tags/$LATEST"
            for f in index.html squachsim.js squachsim.wasm; do
              git show "$LATEST:web-flasher/emulator/$f" > "_site/emulator/$f"
            done
            echo "emulator restored from $LATEST"
          else
            # index.html is hand-written and not a build product, so it always
            # comes from the tree. The two build products come from the build
            # step, which has just compiled them from this tag's sources.
            cp web-flasher/emulator/index.html _site/emulator/index.html
            cp sim/web/squachsim.js            _site/emulator/squachsim.js
            cp sim/web/squachsim.wasm          _site/emulator/squachsim.wasm
            # Loud, because a silent mismatch here is the whole bug this step
            # exists to stop.
            if ! cmp -s sim/web/squachsim.wasm web-flasher/emulator/squachsim.wasm; then
              echo "::notice::the committed emulator differs from this tag's build -- the site serves the freshly built one"
            fi
          fi

      - name: Keep the previous two releases flashable
        # Runs on lab builds too. Skipping it was a mistake with a live
        # consequence: this step is what writes versions.json and the
        # per-release directories the flasher's version dropdown reads, and
        # a lab deploy without it 404'd both. The history here belongs to the
        # RELEASES -- it has nothing to do with what triggered the run.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Release assets carry no CORS headers, so a browser cannot fetch
          # them from the Releases tab -- everything the flasher touches has
          # to be same-origin on Pages. And a Pages deploy replaces the whole
          # site, so older builds only stay reachable if this run puts them
          # back. CI downloads them server-side, where CORS does not apply.
          #
          # Two previous versions is the point where this stops being free.
          # A retained release costs whatever that release shipped: seven
          # binaries from v1.5.17 onward, fifteen for anything older, since
          # those predate the shared esp32-bootloader/partitions pair.
          PREV=$(gh release list --limit 12 --json tagName -q '.[].tagName' \
                 | grep -v "^${TAG}$" | head -2)
          for tag in $PREV; do
            mkdir -p "_site/$tag"
            # The manifests are release assets too, already stamped with
            # that release's version, and they name the same relative
            # paths -- so dropping a manifest into its own release's
            # directory resolves to that release's binaries with no
            # rewriting at all.
            gh release download "$tag" -D "_site/$tag" \
              -p '*-bootloader.bin' -p '*-partitions.bin' \
              -p '*-firmware.bin' -p 'manifest-*.json' \
              || echo "::warning::could not fetch $tag; skipping it"
          done

          # What the flasher offers in its version picker. Written as a
          # file rather than inlined into index.html so the page stays a
          # static asset that does not need regenerating.
          {
            echo '{'
            echo "  \"latest\": \"${TAG}\","
            echo '  "versions": ['
            echo "    { \"tag\": \"${TAG}\", \"dir\": \"\" }"
            for tag in $PREV; do
              if [ -f "_site/$tag/manifest-cyd.json" ]; then
                echo "    ,{ \"tag\": \"$tag\", \"dir\": \"$tag/\" }"
              fi
            done
            echo '  ]'
            echo '}'
          } > _site/versions.json
          cat _site/versions.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
