name: Build and release firmware

# Push a tag like v1.2.0 to: build the firmware, create a GitHub
# Release for that tag with the three raw PlatformIO artifacts
# attached (bootloader/partitions/firmware — the human-facing source
# of truth), then also merge them into one flashable image and attach
# that plus a version-stamped manifest.json. The repo is public now, so
# the web flasher itself is deployed straight to this repo's own
# GitHub Pages site (github.io/SquachWatch-CYD) as part of this same
# run — firmware-merged.bin and manifest.json are copied alongside
# index.html there so the browser fetches them same-origin (GitHub
# release assets don't send CORS headers, so the flasher page can't
# fetch them directly from the Releases tab).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write   # create the GitHub Release
  pages: write       # deploy the flasher site
  id-token: write    # required by actions/deploy-pages

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        # cyd35 (3.5" board port) is a second environment in
        # platformio.ini now but isn't public-release-ready yet (known
        # display/touch issues) -- scope the release build to the 2.8"
        # board only until that changes.
        run: pio run -e cyd

      - name: Determine version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Merge into one flashable image
        run: |
          pip install esptool
          python -m esptool --chip esp32 merge_bin \
            -o firmware-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  .pio/build/cyd/bootloader.bin \
            0x8000  .pio/build/cyd/partitions.bin \
            0x10000 .pio/build/cyd/firmware.bin

      - name: Stamp manifest version
        run: |
          python - <<'PY'
          import json
          p = "web-flasher/manifest.json"
          m = json.load(open(p))
          m["version"] = "${{ steps.ver.outputs.version }}"
          json.dump(m, open(p, "w"), indent=2)
          PY
          cp web-flasher/manifest.json manifest.json

      - name: Create GitHub Release with build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=".github/release-notes/${{ steps.ver.outputs.tag }}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "SquachWatch-CYD ${{ steps.ver.outputs.tag }}" \
            "${NOTES_ARGS[@]}" \
            .pio/build/cyd/bootloader.bin \
            .pio/build/cyd/partitions.bin \
            .pio/build/cyd/firmware.bin \
            firmware-merged.bin \
            manifest.json

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp web-flasher/index.html _site/index.html
          cp web-flasher/manifest.json _site/manifest.json
          cp firmware-merged.bin _site/firmware-merged.bin

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
