; SquachWatch-CYD — PlatformIO build configuration
; See docs/BUILD.md for the friendly walkthrough.
;
; Three physical boards, four build environments, one shared codebase:
; [env] holds everything every build has in common (platform, libs, the
; version-stamping script); each [env:xxx] below only adds the bits
; that are genuinely per-board — the TFT_eSPI driver/pin config header,
; via -include. Application code (src/*.cpp, include/*.h) is compiled
; identically across all of them; only that one header and a few
; #if defined(CYD35)/AWOK blocks in main.cpp differ. cyd and
; cyd-ili9341 are the same physical 2.8" board -- two possible display
; drivers it might have shipped with, not two different boards.

; cyd35 is intentionally excluded from the default env list -- it's
; frozen/not actively developed (ask before resuming work on it) and
; building it on every iteration wastes real time for no benefit.
; `pio run` (no -e flag) now only builds the three boards that actually
; ship. Build cyd35 explicitly with `pio run -e cyd35` when you
; actually need to check it still compiles (e.g. before a release,
; after a change to shared code) -- it stays a normal environment
; below, just not a default one.
[platformio]
default_envs = cyd, cyd-ili9341, awok

[env]
platform = espressif32
board    = esp32dev
framework= arduino
upload_speed = 921600
; Baseline runtime UART speed for the monitor tool -- main.cpp's own
; SERIAL_BAUD default (921600, used when a board doesn't -DSERIAL_BAUD
; its own value) is the same conservative rate, so this stays their
; shared fallback. cyd overrides both to 2000000 below: confirmed on
; real hardware that rate holds cleanly on its CH340-family chip, while
; AWOK's CP210x garbles at 2000000 (Windows' CP210x VCP driver support
; for non-standard high rates is spottier than CH340's). cyd35 hasn't
; been tested at a higher rate, so it stays on this default too rather
; than assuming it behaves like cyd.
monitor_speed = 921600
extra_scripts = pre:extra_script.py

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; XPT2046_Touchscreen: PIO registry version is stuck at 0.0.0-alpha (2019);
    ; pull the current master directly from GitHub. Confirmed pattern from
    ; witnessmenow/ESP32-Cheap-Yellow-Display issue #57 and the randomnerdtutorials
    ; CYD guide.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    h2zero/NimBLE-Arduino@^1.4.0

build_unflags =
    ; Some TFT_eSPI configs define conflicting defaults — clear them.
    -DILI9341_DRIVER
    -DST7789_DRIVER
    -DST7796_DRIVER

; NimBLE roles/pool sizing: detection.cpp only ever scans (observer
; role) -- it never connects out, advertises, or accepts connections,
; so the default config's central/peripheral/broadcaster roles and
; 3-connection pool are pure unused overhead. Confirmed on real
; hardware this overhead was tight enough to make the CLEAR screen's
; frame-buffer reallocation on rotate fail (heap fragmentation from
; WiFi/BLE churn ate the last few KB of the contiguous block it needs)
; -- these flags reclaim that headroom. Scanning itself (setActiveScan,
; getScan()->start()) doesn't touch any of the roles being disabled.
nimble_flags =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=0

; ---- 2.8" board, ST7789 variant (jczn_2432s028r / JC2432W328C,
; 240x320) -- these boards ship with EITHER an ST7789 or an ILI9341
; panel depending on manufacturing batch, same glass/pinout either way,
; and there's no way to tell which from the outside. This is the
; default/more-commonly-reported variant; [env:cyd-ili9341] just below
; is identical except the TFT_eSPI header (see its own comment). Wrong
; driver = solid white screen -- if that happens, flash the other one.
[env:cyd]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd_user_setup.h
    ${env.nimble_flags}

; ---- 2.8" board, ILI9341 variant -- same board as [env:cyd] above,
; older panel batch. Only include/cyd_ili9341_user_setup.h differs
; (driver + RGB order); everything else, including this same
; -DCYD=1, is identical since the app code has no ILI9341-vs-ST7789
; branches of its own -- only the TFT_eSPI header cares. Same USB-
; serial chip as [env:cyd] (same physical board family), so it gets
; the same verified-fast baud rate.
[env:cyd-ili9341]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd_ili9341_user_setup.h
    ${env.nimble_flags}

; ---- 3.5" board (Sunton ESP32-3248S035R, 320x480, ST7796, shared-bus touch) ----
[env:cyd35]
build_flags =
    -DCYD35=1
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd35_user_setup.h
    ${env.nimble_flags}

; ---- AWOK 2.4" board (ESP32-Marauder V6.1, 240x320, ILI9341, shared-bus touch) ----
; Not a CYD — WROOM-32 hardware, entirely different pin map (VSPI display
; on 18/23/19 with CS=17/DC=16, not 12/13/14/15/2), and XPT2046 touch
; shares the display's SPI bus rather than getting its own peripheral.
; See include/awok_user_setup.h for the pin/driver details.
[env:awok]
build_flags =
    -DAWOK=1
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/awok_user_setup.h
    ${env.nimble_flags}
