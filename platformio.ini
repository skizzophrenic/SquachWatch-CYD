; SquachWatch-CYD — PlatformIO build configuration
; See docs/BUILD.md for the friendly walkthrough.
;
; Three physical boards, four build environments, one shared codebase:
; [env] holds everything every build has in common (platform, libs, the
; version-stamping script); each [env:xxx] below only adds the bits
; that are genuinely per-board — the TFT_eSPI driver/pin config header,
; via -include. Application code (src/*.cpp, include/*.h) is compiled
; identically across all of them; only that one header and a few
; #if defined(CYD35)/AWOK blocks in main.cpp differ. cyd and
; cyd-ili9341 are the same physical 2.8" board -- two possible display
; drivers it might have shipped with, not two different boards.

; cyd35 is intentionally excluded from the default env list -- it's
; frozen/not actively developed (ask before resuming work on it) and
; building it on every iteration wastes real time for no benefit.
; `pio run` (no -e flag) only builds the three boards that actually
; ship, and so does CI. It stays a normal environment below, just not a
; default one.
;
; Don't build it "just to check it still compiles" after a shared-code
; change either -- compiling is not the bar it's failing. As of
; 2026-09-03 the 3.5" board BOOT LOOPS on real hardware: it reaches
; setup(), loads its touch calibration, fails to mount SD, and then the
; NimBLE host task panics with LoadStoreAlignment on a corrupted
; spinlock (EXCVADDR 0x3fecb1b1, not a valid DRAM address) -- memory
; corruption or a stack overflow, with NimBLE as the victim rather than
; the cause. Confirmed pre-existing by flashing a v1.4.3 build, which
; crashes identically, so it is not from any later change.
;
; The untested hypothesis, for whoever picks this up: display, touch and
; SD all share VSPI on this board, and the panic follows two SD mount
; failures. On the shipping 2.8" the same SD mount fails harmlessly,
; but there SD isn't on the display's bus. Cheapest probe is to stub
; SdLog::begin() on cyd35 and see if the panic goes away.
;
; A green build here means nothing about whether the board runs.
[platformio]
default_envs = cyd, cyd-ili9341, awok

[env]
; PINNED. Unpinned, `espressif32` silently moved to platform 55.03.39 on the
; build machine on 2026-09-12 -- Arduino core 3.3.9 with GCC 14, replacing the
; Arduino 2.0.14 / GCC 8.4.0 pair that every build and release had used. The
; first sign was a build failing to find stddef.h mid-session. Core 3 also
; removes ledcSetup()/ledcAttachPin(), which main.cpp's backlight code uses on
; every board, so a quiet upgrade here is a broken release, not a warning.
;
; 6.5.0 is the platform that ships arduino-esp32 2.0.14 (framework package
; 3.20014.231204) and toolchain-xtensa-esp32 8.4.0+2021r2-patch5. Moving off it
; is a deliberate job: port the LEDC calls, rebuild every board, soak.
platform = espressif32@6.5.0
board    = esp32dev
framework= arduino
upload_speed = 921600
; Two 1.92MB app slots (partitions_ota.csv) since v1.7.0, replacing the 3MB
; single-app huge_app.csv every earlier release used. A board needs a second
; slot to receive an over-the-air update while still running the old one --
; see partitions_ota.csv for the full layout and for why the first release
; carrying it had to go out over USB. No SPIFFS/LittleFS either way: SD
; logging goes to a real card, not internal flash.
;
; NVS keeps the exact same 0x9000 offset and 20K size in both tables (as
; does coredump at 0x3F0000), so saved settings survive the switch on
; their own — nothing about the table change moves or resizes them.
;
; Preserving them across an update is a property of *what gets written*,
; though, not of the table. `pio run -t upload` writes only
; 0x1000/0x8000/0x10000 and leaves NVS alone. The web flasher does too,
; but only since it stopped serving the single merged image: that blob
; is padded with 0xFF across the gaps between those regions, and one of
; those gaps is NVS, so flashing it at offset 0 erased settings on every
; update. See the Assemble Pages site step in
; .github/workflows/release-flasher.yml.
; Two app slots, so a build can be delivered over the air -- see
; partitions_ota.csv for the layout and for why this had to change.
; NVS and coredump keep their old offsets, so settings, PINs and mesh
; pairings survive the migration.
board_build.partitions = partitions_ota.csv
; Baseline runtime UART speed for the monitor tool -- main.cpp's own
; SERIAL_BAUD default (921600, used when a board doesn't -DSERIAL_BAUD
; its own value) is the same conservative rate, so this stays their
; shared fallback. cyd overrides both to 2000000 below: confirmed on
; real hardware that rate holds cleanly on its CH340-family chip, while
; AWOK's CP210x garbles at 2000000 (Windows' CP210x VCP driver support
; for non-standard high rates is spottier than CH340's). cyd35 hasn't
; been tested at a higher rate, so it stays on this default too rather
; than assuming it behaves like cyd.
monitor_speed = 921600
extra_scripts = pre:extra_script.py

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; XPT2046_Touchscreen: PIO registry version is stuck at 0.0.0-alpha (2019);
    ; pull the current master directly from GitHub. Confirmed pattern from
    ; witnessmenow/ESP32-Cheap-Yellow-Display issue #57 and the randomnerdtutorials
    ; CYD guide.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    h2zero/NimBLE-Arduino@^2.5.1

build_unflags =
    ; Some TFT_eSPI configs define conflicting defaults — clear them.
    -DILI9341_DRIVER
    -DST7789_DRIVER
    -DST7796_DRIVER

; NimBLE roles/pool sizing: detection.cpp only ever scans (observer
; role) -- it never connects out or accepts connections.
; The default config's central/peripheral/broadcaster roles and
; 3-connection pool are pure unused overhead. Confirmed on real
; hardware this overhead was tight enough to make the CLEAR screen's
; frame-buffer reallocation on rotate fail (heap fragmentation from
; WiFi/BLE churn ate the last few KB of the contiguous block it needs)
; -- these flags reclaim that headroom. Scanning itself (setActiveScan,
; getScan()->start()) doesn't touch any of the roles being disabled.
; The set below leaves the BROADCASTER role ENABLED. SquachMesh has to
; advertise and cannot with that role compiled out, so as of v1.5.23 this is
; what every environment uses.
;
; This was not a free change and the comment above says why: those roles were
; disabled because their overhead was tight enough to make the CLEAR screen's
; frame-buffer reallocation on rotate FAIL, confirmed on real hardware. Heap
; fragmentation from WiFi/BLE churn ate the contiguous block it needs.
;
; What is known at the point of shipping it: a one-hour soak on an ST7789
; board at 80MHz with the broadcaster enabled did not reproduce the rotate
; failure, and rotation was exercised by hand. What is NOT known: the same on
; the ILI9341 boards or on AWOK, neither of which has been soaked with this
; set. The diagnostics screen reports the largest free contiguous block,
; which is the number to look at if a board starts failing to rotate.
;
; The PERIPHERAL role came back for Bluetooth firmware updates (ota_ble.cpp),
; which need a GATT server a browser can connect to. It is only ever used from
; the UPDATE FIRMWARE screen; the mesh advert stays non-connectable (see
; setAdvertising() in detection.cpp). Its heap cost is the number to watch on
; the diagnostics screen, same as the broadcaster's was.
nimble_flags_mesh =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1

; ---- 2.8" board, ST7789 variant (jczn_2432s028r / JC2432W328C,
; 240x320) -- these boards ship with EITHER an ST7789 or an ILI9341
; panel depending on manufacturing batch, same glass/pinout either way,
; and there's no way to tell which from the outside. This is the
; default/more-commonly-reported variant; [env:cyd-ili9341] just below
; is identical except the TFT_eSPI header (see its own comment). Wrong
; driver = solid white screen -- if that happens, flash the other one.
[env:cyd]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; ---- 2.8" board, ILI9341 variant -- same board as [env:cyd] above,
; older panel batch. Only include/cyd_ili9341_user_setup.h differs
; (driver + RGB order); everything else, including this same
; -DCYD=1, is identical since the app code has no ILI9341-vs-ST7789
; branches of its own -- only the TFT_eSPI header cares. Same USB-
; serial chip as [env:cyd] (same physical board family), so it gets
; the same verified-fast baud rate.
[env:cyd-ili9341]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd_ili9341_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; ---- 2.8" board, overclocked display ----------------------------------
; Identical to [env:cyd] and [env:cyd-ili9341] above in every respect
; except the display clock, which -D overrides in the user-setup header
; (guarded with #ifndef there for exactly this). No duplicate header, and
; because it is a build flag rather than a header edit, changing it
; actually forces a rebuild.
;
; These exist so the web flasher can offer an "experimental overclock"
; checkbox: same board, same driver, one orthogonal choice, and undoing
; it is a reflash rather than something the user has to find in a menu on
; a display that may be the thing that broke. 80MHz is above the panel's
; rated write clock -- see cyd_user_setup.h. Deliberately NOT offered for
; AWOK, whose touch shares the display bus and goes through TFT_eSPI's
; own touch path, which reads SPI_FREQUENCY directly.
;
; Excluded from default_envs: `pio run` should stay a three-board build.
[env:cyd-fast]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -DSPI_FREQUENCY=80000000
    -include $PROJECT_DIR/include/cyd_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

[env:cyd-ili9341-fast]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -DSPI_FREQUENCY=80000000
    -include $PROJECT_DIR/include/cyd_ili9341_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; ---- crowd benchmark: TEST BUILDS, never released ----------------------
; The same firmware with CROWD_BENCH defined: after boot the CLEAR screen runs
; include/crowd_bench.h's scenes -- one to thirty Squachys -- times each, and
; leaves a table on screen. Not in the flasher and not in CI. One per display
; clock that users actually run, since the push is most of every frame.
[env:cyd-fast-crowd]
extends = env:cyd-fast
build_flags = ${env:cyd-fast.build_flags} -DCROWD_BENCH=1

; The fake flood: FLOOD N on the console feeds the scan handler N made-up
; connectable adverts a second that never answer, the shape of a college IT
; floor. Bench only; see src/flood_bench.cpp.
[env:cyd-fast-flood]
extends = env:cyd-fast
build_flags = ${env:cyd-fast.build_flags} -DFLOOD_BENCH=1

[env:cyd-crowd]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DCROWD_BENCH=1

[env:cyd-ili9341-crowd]
extends = env:cyd-ili9341
build_flags = ${env:cyd-ili9341.build_flags} -DCROWD_BENCH=1

; ---- 3.5" board (Sunton ESP32-3248S035R, 320x480, ST7796, shared-bus touch) ----
[env:cyd35]
monitor_speed = 2000000
build_flags =
    -DCYD35=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd35_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; The 3.5" at 80 MHz on the display wire, the same knob as cyd-fast. Its
; 480x320 push is 76 ms at 40 MHz, which caps the main screen at 7-8 fps.
[env:cyd35-fast]
monitor_speed = 2000000
build_flags =
    -DCYD35=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -DSPI_FREQUENCY=80000000
    -include $PROJECT_DIR/include/cyd35_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; ---- RL Phantom 2.4" (Sunton ESP32-2432S024, 240x320, ILI9341) --------
; A CYD with the SAME display wiring as the 2.8" board -- smaller glass,
; identical pins -- so this is [env:cyd-ili9341] with two changes: the
; backlight is on GPIO27 rather than 21, and the banner says which board it
; is. See include/rlphantom_user_setup.h for both, and for why touch needs
; no configuration at all: the board ships resistive OR capacitive on the
; same GPIO33, and main.cpp already probes for the capacitive controller and
; falls back. One build covers both variants.
;
; THIS capacitive build has never run on a real board. CI compiles it so the
; code does not rot, but it is not published anywhere -- not the public picker,
; not the lab entry. Publish it once somebody confirms a real ...S024C works.
; The resistive build below is the one on the public flasher.
;
; No overclock variant on purpose. An out-of-spec display clock is a poor
; thing to discover on hardware nobody here has seen.
[env:rlphantom]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DRLPHANTOM=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/rlphantom_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; ---- RL Phantom 2.4", RESISTIVE variant -------------------------------
; The same board with the other touch chip. It ships as ...S024C
; (capacitive CST820 on I2C) or ...S024R (resistive XPT2046 on the DISPLAY's
; SPI bus), and the two cannot be told apart without reading the silkscreen
; -- so both are offered and the tester flashes one, then the other. Exactly
; the arrangement the 2.8" board has for its two display drivers.
;
; -DRLPHANTOM_R makes main.cpp read raw touch values off the display's bus
; (TOUCH_RAW_SHARED_BUS) and run the 2.8" board's rotation maths on them, so
; touch follows the screen round. A board with no saved calibration runs the
; corner targets on first boot. Confirmed on real boards; on the public flasher.
[env:rlphantom-r]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DRLPHANTOM_R=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/rlphantom_r_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; ---- Freenove 3.2" CYD (FNK0103L), resistive, ST7789 ----
; The RL Phantom resistive's pins exactly (display on HSPI, backlight 27, the
; XPT2046 on the display's bus with CS 33), so RLPHANTOM_R's shared-bus touch
; path; its own panel setup (ST7789, BGR, inversion on). FREENOVE32 marks what
; differs. Pins: include/freenove32_user_setup.h.
[env:freenove32]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DRLPHANTOM_R=1
    -DFREENOVE32=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/freenove32_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; ---- LilyGo T-Watch S3 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM, 240x240 ST7789) ----
; A watch, not a CYD: no SD card, no status light, capacitive FT6336 touch on
; I2C, and an AXP2101 power chip that has to be switched on before the
; screen or the touch chip answer (twatchPowerUp() in main.cpp). Native USB
; for the console, so the baud is nominal. Its own partition table, since a
; 16 MB part gets two 4 MB app slots. Pins: include/twatch_s3_user_setup.h.
[env:twatch-s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_twatch.csv
monitor_speed = 115200
; Native USB: the esptool stub cannot switch the link to 921600 ("No serial
; data received" right after "Changing baud rate"). The nominal speed is fine;
; USB moves the bytes at its own pace anyway.
upload_speed = 115200
lib_deps =
    ${env.lib_deps}
    lewisxhe/XPowersLib@^0.3.3
build_flags =
    -DTWATCH_S3=1
    -DSERIAL_BAUD=115200
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/twatch_s3_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; ---- AWOK 2.4" board (ESP32-Marauder V6.1, 240x320, ILI9341, shared-bus touch) ----
; Not a CYD — WROOM-32 hardware, entirely different pin map (VSPI display
; on 18/23/19 with CS=17/DC=16, not 12/13/14/15/2), and XPT2046 touch
; shares the display's SPI bus rather than getting its own peripheral.
; See include/awok_user_setup.h for the pin/driver details.
[env:awok]
build_flags =
    -DAWOK=1
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/awok_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; ---- Elecrow CrowPanel ADVANCE 7.0-HMI (ESP32-S3-N16R8, 800x480 RGB) -------
; Not a CYD and not a watch: there is no SPI display bus at all. The panel is
; an 800x480 RGB parallel one, driven by ESP-IDF's own esp_lcd RGB driver (the
; one Elecrow's examples use -- see include/crowpanel7_rgb.h for why not
; LovyanGFX) out of a 750 KiB framebuffer in OPI PSRAM, and TFT_eSPI is kept
; only as the TYPE the app's canvas pointer needs (include/crowpanel7_display.h).
; The app renders 400x240 into a 96 KB sprite in INTERNAL RAM and the blit
; doubles it to the panel; that is what keeps the picture still (the board
; header says why), not a memory economy.
;
; Touch is a GT911 and the backlight is an I2C command to an STC8H1K28 helper
; MCU -- both on the same bus, so nothing may call Wire.end(). USB-C reaches
; UART0 through a CH340K: no native USB, so no ARDUINO_USB_CDC_ON_BOOT and no
; 115200 upload workaround.
;
; CONFIG_SPIRAM_SUPPORT=1 is what lets a TFT_eSPI sprite reach PSRAM when it
; has to (the -native build's 384 KB frame): callocSprite() gates its
; ps_calloc branch on that old IDF name, and arduino-esp32 2.0.14 on the S3
; defines CONFIG_SPIRAM instead. Safe because esp32-hal-psram.h only #undefs
; it when BOARD_HAS_PSRAM is absent.
[env:crowpanel7]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_crowpanel7.csv
monitor_speed = 115200
build_flags =
    -DCROWPANEL7=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DSERIAL_BAUD=115200
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/crowpanel7_user_setup.h
    ${env.nimble_flags_mesh}
    -DSQUACH_MESH=1

; Native 800x480, frame in PSRAM. Twitches on this core -- the UI's writes into
; PSRAM starve the panel's DMA (crowpanel7_board.h). Kept for a core with
; bounce buffers or faster PSRAM; not for the flasher.
[env:crowpanel7-native]
extends = env:crowpanel7
build_flags = ${env:crowpanel7.build_flags} -DCROWPANEL_SCALE=1

; ---- CrowPanel bench builds: never released -------------------------------
; A static test picture -- colour bars and a one-pixel grid -- drawn right
; after the panel comes up, then setup() stops: the pin map, the red/blue
; order, the PSRAM mode and the pixel-clock lock, each on its own, plus the
; measured frame period, quiet and then with a flash write every 20 ms in
; alternate three-second phases -- what flash does to the picture, in numbers.
[env:crowpanel7-paneltest]
extends = env:crowpanel7
build_flags = ${env:crowpanel7.build_flags} -DCROWPANEL7_PANELTEST=1

; The product build plus a report at the end of setup(): contiguous internal
; RAM, the PCF8563 clock, the card slot (raw CMD0, then a mount), the
; helper's buzzer, and a WiFi scan through the sniffer's own driver.
[env:crowpanel7-probe]
extends = env:crowpanel7
build_flags = ${env:crowpanel7.build_flags} -DCROWPANEL7_PERIPH_PROBE=1

; The product build plus a serial line per touch press and release, with the
; GT911's report cadence while the finger is down.
[env:crowpanel7-touchtrace]
extends = env:crowpanel7
build_flags = ${env:crowpanel7.build_flags} -DCROWPANEL7_TOUCH_TRACE=1
