  <path d="M6.65 4.85A2.4 2.4 0 0 1 4 6.3" fill="none" stroke="#5e5228" stroke-opacity="0.35" stroke-width="0.12"/>
  <circle cx="82.8" cy="4" r="1.66" fill="none" stroke="#7a6733" stroke-width="0.18"/>
  <path d="M80.95 3.15A2.4 2.4 0 0 1 83.6 1.7" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.12"/>
  <path d="M84.65 4.85A2.4 2.4 0 0 1 82 6.3" fill="none" stroke="#5e5228" stroke-opacity="0.35" stroke-width="0.12"/>
  <circle cx="4.8" cy="46" r="1.66" fill="none" stroke="#7a6733" stroke-width="0.18"/>
  <path d="M2.95 45.15A2.4 2.4 0 0 1 5.6 43.7" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.12"/>
