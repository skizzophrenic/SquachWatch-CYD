  <circle cx="5.8" cy="12.5" r="0.72" fill="#b08a00" fill-opacity="0.8"/>
  <circle cx="5.8" cy="12.5" r="0.55" fill="url(#ring)"/>
  <circle cx="5.8" cy="12.5" r="0.24" fill="#3b3312"/>
  <circle cx="5.8" cy="17.5" r="0.72" fill="#b08a00" fill-opacity="0.8"/>
  <circle cx="5.8" cy="17.5" r="0.55" fill="url(#ring)"/>
  <circle cx="5.8" cy="17.5" r="0.24" fill="#3b3312"/>
