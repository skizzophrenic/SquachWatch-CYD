    <circle cx="7.9" cy="1.3" r="0.22"/><circle cx="7" cy="8.2" r="0.22"/><circle cx="7.2" cy="35.8" r="0.22"/><circle cx="3.8" cy="24" r="0.22"/><circle cx="3.8" cy="39.8" r="0.22"/><circle cx="80.4" cy="15.2" r="0.22"/><circle cx="85.7" cy="14.4" r="0.22"/><circle cx="84.6" cy="41.9" r="0.22"/><circle cx="80.9" cy="45.4" r="0.22"/>
  </g>
  <!-- light sensor (LDR) with its silkscreen box -->
  <rect x="81.35" y="7.75" width="3.5" height="6.05" rx="0.15" fill="none" stroke="#fbf6e2" stroke-width="0.14" stroke-opacity="0.9"/>
  <rect x="81.85" y="8.0" width="2.5" height="0.28" rx="0.1" fill="#c7bd96"/>
  <rect x="81.75" y="8.25" width="2.7" height="1.65" rx="0.12" fill="#fffef6" stroke="#d6cea8" stroke-width="0.08"/>
