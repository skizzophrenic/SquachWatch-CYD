  <path fill="url(#pcbSheen)" fill-rule="evenodd" d="M3.4 0.42H84.2A2.18 2.18 0 0 1 86.38 2.6V47.4A2.18 2.18 0 0 1 84.2 49.58H3.4A2.18 2.18 0 0 1 1.22 47.4V2.6A2.18 2.18 0 0 1 3.4 0.42Z M4.8 1.2a2.8 2.8 0 1 0 0.001 0Z M82.8 1.2a2.8 2.8 0 1 0 0.001 0Z M4.8 43.2a2.8 2.8 0 1 0 0.001 0Z M82.8 43.2a2.8 2.8 0 1 0 0.001 0Z"/>
